<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand">
            Dashboard
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="row">

        <div class="col-md-4">

            <div class="card text-center">

                <div class="card-body">

                    <h2>1200</h2>

                    <p>Total Users</p>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card text-center">

                <div class="card-body">

                    <h2>450</h2>

                    <p>Orders</p>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card text-center">

                <div class="card-body">

                    <h2>₹80,000</h2>

                    <p>Revenue</p>

                </div>

            </div>

        </div>

    </div>

    <div class="mt-5">

        <h3>User Statistics</h3>

        <div class="progress">

            <div class="progress-bar w-75">
                75%
            </div>

        </div>

    </div>

</div>

</body>
</html>
